# Sweeps for `mixstrat-sweep`. `mixstrat-sweep all` runs every sweep below in
# order; `mixstrat-sweep <name>` runs one. Each top-level table is one sweep;
# every run is one `mixstrat-train` call. Keys:
#   description   free text
#   est_minutes   rough minutes per run, for the --dry-run estimate
#   base          mixstrat-train options shared by every run (underscores for dashes)
#   grid          options to vary; every combination runs
#   variants      optional named option sets, each crossed with the grid
#   tune          optional: choose `keys` from an earlier sweep's results (the
#                 combination with the lowest `metric`, averaged over each run's
#                 last `last` evals and then over seeds); overrides base

# Does a stronger magnet or an averaged opponent stop self-play from cycling?
# With beta = 0.02 and no averaging (run cf525b35), exploitability bounced
# between 7% and 17% as the model hopped between pure strategies.
[selfplay_stability]
description = "Self-play stability on kuhn3: magnet strength x opponent averaging, 2 seeds."
est_minutes = 8
base = { objective = "value-self-play", game = ["kuhn_classic"], held_out = ["kuhn_lowball"], steps = 150, eval_every = 10 }
grid = { beta = [0.05, 0.1, 0.2, 0.5], window = [1, 10], seed = [0, 1] }

# Does training on varied rules make transfer to 3-card lowball appear? Variant C
# is the key test: the model sees "lowest card wins" only with 13 cards. beta and
# window come from the most stable selfplay_stability setting (see `tune`; the
# values in `base` are the fallback if that sweep has no finished runs). Self-play
# recomputes its values every 5 steps (value_refresh): with 13-card games the
# strategy snapshot is ~100k tokens and would otherwise double the run time.
# Measured: ~17-22 min per run for A, ~40-55 min for B-D (~5.1 h total).
[train_distribution]
description = "Which training games make kuhn_lowball transfer appear? Distill vs self-play."
est_minutes = 38
base = { steps = 400, eval_every = 25, batch_infosets = 24, held_out = ["kuhn_lowball"], beta = 0.2, window = 10, value_refresh = 5 }
grid = { objective = ["distill", "value-self-play"] }
tune = { from = "selfplay_stability", keys = ["beta", "window"], metric = "kuhn_classic/exploitability_norm", last = 5 }

[train_distribution.variants]
A = { game = ["kuhn_classic"] }
B = { game = ["kuhn_classic", "kuhn13"] }
C = { game = ["kuhn_classic", "kuhn13", "kuhn13_lowball"] }
D = { game = ["kuhn_classic", "kuhn13", "kuhn13_lowball", "kuhn13_low_heavy", "kuhn13_duplicates"] }

# Does training on randomly relabelled prompts make the model read the rules? With
# probability 0.75 each training infoset is shown under random card names from
# llm/relabel.py (half of those also list the ranks in reverse and flip the
# showdown rule; the target strategy is unchanged). The probe labels (J/Q/K
# reversals, 2/3/4, Vex/Dorn/Pim) never appear, so every held-out game is new.
# Compare with train_distribution A/B distill (same settings, no relabelling),
# then run `mixstrat-rules collect --adapter <these checkpoints>`.
[label_randomization]
description = "Distill with random card labels and rank listings; test transfer to relabelled and lowball games."
est_minutes = 25
base = { objective = "distill", steps = 400, eval_every = 25, batch_infosets = 24, relabel = 0.75, relabel_flip = 0.5, held_out = ["kuhn_lowball", "kuhn_lowball_234", "kuhn_reversed", "kuhn_classic_234", "kuhn_lowball_reversed"] }
grid = { seed = [0, 1] }

[label_randomization.variants]
A = { game = ["kuhn_classic"] }
B = { game = ["kuhn_classic", "kuhn13"] }

# Strategic transfer, simplest version: does the model adjust its strategy to a
# bet size it never trained on? Train on quarter- and half-pot 3-card Kuhn (with
# label randomization, which made the model read the rules); test on pot and
# 2x pot. Baseline to beat, copying the nearest trained equilibrium (half pot):
# 4.6% on kuhn_pot, 13.9% on kuhn_overbet. Interpolating (testing half pot) would
# be too easy: averaging the quarter- and pot-size equilibria is already 3.0%.
[bet_size_transfer]
description = "Train kuhn3 at quarter + half pot (relabelled); test at pot and 2x pot."
est_minutes = 20
base = { objective = "distill", game = ["kuhn_quarter_pot", "kuhn_classic"], held_out = ["kuhn_pot", "kuhn_overbet", "kuhn_lowball"], steps = 400, eval_every = 25, batch_infosets = 24, relabel = 0.75, relabel_flip = 0.5 }
grid = { seed = [0, 1] }
