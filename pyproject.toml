[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mixstrat"
version = "0.1.0"
description = "Testbench for RL post-training of LLMs on mixed-strategy poker variants"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
llm = [
    "torch>=2.7",
    "transformers>=4.51",   # Qwen3 support
    "peft>=0.15",
    "accelerate>=1.6",
]
tracking = [
    "wandb>=0.19",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mixstrat"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "NPY",      # numpy-specific rules
    "RUF",      # ruff-specific rules
]
ignore = [
    "E501",     # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (e.g. solving many game variants)",
    "gpu: tests that need a CUDA GPU and model weights",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
